<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

</head>

<body>
    <h1 id="titolo">Monumenti di Roma</h1>

    <!-- Aggiunta: form per inserire nuovo monumento -->
    <form id="monumentoForm" class="monumento-form" onsubmit="return false;">
        <label for="nomeMonumento">Nome (opzionale)</label>
        <input id="nomeMonumento" type="text" placeholder="Es. Colosseo">
        <label for="latMonumento">Latitudine</label>
        <input id="latMonumento" type="number" step="any" placeholder="41.8902">
        <label for="lngMonumento">Longitudine</label>
        <input id="lngMonumento" type="number" step="any" placeholder="12.4922">
        <button id="btnAddMonumento" type="button">Aggiungi Monumento</button>
        <button id="btnShowStats" type="button">Mostra Statistiche Monumenti</button>
    </form>

    <div id="map" style="height: 80vh;"></div>
    <a href="https://it.wikipedia.org/wiki/Roma" class="linkWiki" target="_blank">Wikipedia di Roma ciao ciao</a>

    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Includi il file dei dati/utility dei monumenti -->

    <script src="script.js"></script>
    <script src="./monumenti.js"></script>
</body>

</html>
